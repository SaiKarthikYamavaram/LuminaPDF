<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Android adaptive-icon foreground: the mark from lumina-icon.svg on a transparent ground,
    scaled to 0.82 so it stays inside the 66/108dp safe zone under every launcher mask.
  -->
  <defs>
    <linearGradient id="paper" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EBE1D0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F7C65E"/>
      <stop offset="1" stop-color="#C67D0C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#F2B84B" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F2B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
    <circle cx="512" cy="512" r="390" fill="url(#halo)"/>
    <path d="M312 176 H600 L740 316 V820 A30 30 0 0 1 710 850 H312 A30 30 0 0 1 282 820 V206 A30 30 0 0 1 312 176 Z"
          fill="url(#paper)"/>
    <path d="M600 176 L740 316 H628 A28 28 0 0 1 600 288 Z" fill="#DCCDB0"/>
    <path d="M424 392 V668 H626" fill="none" stroke="url(#amber)" stroke-width="104"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
